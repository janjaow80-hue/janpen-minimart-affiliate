<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="shopeeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5722"/>
      <stop offset="100%" stop-color="#EE4D2D"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background with Safe Padding for Maskable Icons -->
  <rect width="512" height="512" rx="110" fill="url(#shopeeGrad)"/>

  <!-- Subtle glow inner circle -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.15"/>

  <!-- Main Bag / Storefront Shape -->
  <g filter="url(#shadow)">
    <!-- Shopping Bag Handle -->
    <path d="M196 160 C 196 110, 316 110, 316 160" fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round"/>

    <!-- Bag Body -->
    <path d="M140 180 L372 180 L350 400 C 348 418, 334 430, 316 430 L196 430 C 178 430, 164 418, 162 400 Z" fill="#FFFFFF"/>
    
    <!-- Shopee / Affiliate S ribbon & Star -->
    <path d="M220 220 L292 220 C 270 260, 242 260, 292 310 C 298 316, 292 330, 280 330 L216 330 C 224 316, 230 300, 220 286 L250 286 C 265 286, 270 274, 256 260 C 240 246, 236 236, 220 220 Z" fill="#EE4D2D"/>
    
    <!-- Minimart Badge (Canopy Stripes) -->
    <path d="M140 180 L372 180 L360 215 L152 215 Z" fill="url(#shopeeGrad)"/>
    <path d="M185 180 L220 180 L215 215 L180 215 Z" fill="#FFFFFF" fill-opacity="0.35"/>
    <path d="M290 180 L325 180 L320 215 L285 215 Z" fill="#FFFFFF" fill-opacity="0.35"/>
    
    <!-- Mini Commission Gold Star Badge -->
    <circle cx="330" cy="350" r="42" fill="url(#goldGrad)" stroke="#FFFFFF" stroke-width="6"/>
    <polygon points="330,324 338,342 356,342 341,354 347,372 330,360 313,372 319,354 304,342 322,342" fill="#D84315"/>
  </g>

  <!-- Typography: JP MINIMART -->
  <text x="256" y="380" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#EE4D2D" text-anchor="middle" letter-spacing="2">JANPEN</text>
  <text x="256" y="475" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="22" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">SHOPEE AFFILIATE</text>
</svg>
